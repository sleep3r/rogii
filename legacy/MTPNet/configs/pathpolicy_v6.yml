# PathPolicy v6 — CE classifier with soft KL labels
# Root cause of v5 failure: training loop bug (loss block outside batch loop)
# v6 fix: correct training loop + switch to classifier head for cleaner gradient signal
# Primary metric: val_acc (higher = better)
# Gate: assembled MWR gain vs B2 >= +0.15 ft

head_type: classifier
d_model: 128
n_layers: 3
nhead: 4
dim_ff: 256
dropout: 0.2
batch_size: 64
n_epochs: 80
lr: 2.0e-4
weight_decay: 1.0e-4
lambda_v: 0.1
label_smoothing: 0.0
soft_kl_alpha: 0.8       # blend: 0.2 * hard CE + 0.8 * soft KL
kl_tau: 2.0              # temperature for soft targets: softmax(-rmse/tau)
early_stop_patience: 15
tail_oversample: 2
val_frac: 0.2
seed: 42
output_dir: artifacts/pathpolicy_v6
oracle_chunks: artifacts/oracle_v2_strict/oracle_chunks.parquet
data_dir: data/train
base_path: ../old/artifacts/oof_baseline/schema10_oof.parquet
b2_path: ../old/artifacts/formation_b2_danger_guard_a2_full_schema10/guarded_predictions.parquet
a_path: ../old/artifacts/formation_plane_knn/oof_candidates.parquet
mtp_path: artifacts/mtp_v3_gr_forced/track_row_predictions.parquet
