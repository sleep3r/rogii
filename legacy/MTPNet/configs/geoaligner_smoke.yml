run:
  name: geoaligner_smoke
  output_dir: artifacts/geoaligner_smoke

data:
  rows_per_step: 16
  max_horizontal_steps: 256
  vertical_step_ft: 10.0
  max_typewell_bins: 256

model:
  d_model: 64
  n_heads: 4
  lateral_layers: 1
  typewell_layers: 1
  ffn_dim: 128
  dropout: 0.10

decode:
  max_jump_bins: 4
  jump_penalty: 0.03
  anchor_band_radius_ft: 160.0
  anchor_band_penalty: 0.02
  topk: [1, 3, 10]

train:
  batch_size: 2
  epochs: 1
  lr: 3.0e-4
  weight_decay: 1.0e-4
  device: auto
  seed: 42
  valid_fraction: 0.20
  clip_grad_norm: 1.0

data_dir: data
k_wells: 12
