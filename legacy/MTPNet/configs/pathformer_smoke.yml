# PathFormer smoke — quick sanity check (1 epoch, 20 wells, tiny model)
# Run: make pf-smoke

run:
  name: pathformer_smoke
  output_dir: artifacts/pathformer_smoke

data:
  rows_per_step: 16
  max_seq_len: 512

model:
  d_model: 64
  n_heads: 4
  n_encoder_layers: 2
  ffn_dim: 256
  dropout: 0.0
  anchor_skip: true
  anchor_feature_index: 17
  anchor_valid_index: 22
  anchor_scale: 100.0

augmentation:
  drop_b2_prob: 0.0
  drop_base_prob: 0.0
  drop_a_prob: 0.0
  drop_all_priors_prob: 0.0

train:
  batch_size: 4
  epochs: 1
  lr: 3.0e-4
  weight_decay: 0.0
  device: auto
  seed: 42
  valid_fraction: 0.20
  tail_oversample_factor: 1.0
  huber_delta: 5.0
  smooth_lambda: 0.0
  clip_grad_norm: 1.0
  save_every_n_epochs: 1

priors:
  enabled: true
  id_column: id
  base_path: ../old/artifacts/oof_baseline/schema10_oof.parquet
  base_column: schema10_oof_pp
  a_path: ../old/artifacts/formation_plane_knn/oof_candidates.parquet
  a_p50_column: formation_sample_median
  a_p10_column: formation_sample_p10
  a_p90_column: formation_sample_p90

data_dir: data/train
k_wells: 20
tail_audit_path: artifacts/tail_audit_v1/well_tail_audit.csv
