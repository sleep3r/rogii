data_dir: data
k_wells: -1
cache_dir: artifacts/bpi_conv_tiny_local/cache

run:
  name: bpi_conv_tiny_local
  output_dir: artifacts/bpi_conv_tiny_local
  log_every: 1
  log_first_steps: 8

data:
  max_seq_len: 512
  val_max_seq_len: 0
  stride: 1
  random_train_crop: true
  gr_smooth_sigmas: [5.0, 15.0, 50.0]
  gr_fill_method: linear
  tw_offsets: [-120.0, -80.0, -40.0, -20.0, 0.0, 20.0, 40.0, 80.0, 120.0]
  use_hmm_prior: false
  hmm_tvt_step: 4.0
  hmm_tvt_margin: 60.0
  hmm_velocity_sigma: 0.025
  hmm_gr_sigma: 15.0
  hmm_max_velocity: 0.12
  normalise: true

model:
  in_channels: 64
  stage_channels: [32, 64, 96]
  stage_strides: [2, 2, 2]
  n_blocks: 1
  max_params: 500000
  use_bottleneck_attn: false
  attn_heads: 4
  attn_window: 128
  use_typewell_cross_attn: false
  tw_channels: 32
  decoder_channels: [64, 48, 32]
  dropout: 0.02
  stoch_depth: 0.0
  predict_velocity: false
  predict_dip_sign: false
  predict_seg_boundary: false

augmentation:
  enabled: true
  gr_dropout_prob: 0.10
  gr_dropout_frac: 0.20
  gr_scale_range: [0.90, 1.10]
  gr_shift_range: [-6.0, 6.0]
  gr_noise_std: 2.0
  tw_smooth_prob: 0.0
  tw_noise_std: 0.0
  pseudo_anchor_prob: 0.10
  pseudo_anchor_lo: 0.40
  pseudo_anchor_hi: 0.80
  feature_noise_std: 0.002

loss:
  w_tvt: 1.0
  tvt_huber_delta: 5.0
  w_forward_gr: 0.03
  gr_huber_delta: 10.0
  w_gr_grad: 0.25
  w_gr_corr: 0.0
  gr_corr_window: 64
  w_anchor: 0.05
  w_velocity: 0.0
  w_dip_sign: 0.0
  w_seg_boundary: 0.0
  w_smooth: 0.005
  w_nll: 0.0
  w_distill: 0.0
  hidden_weight: 1.0
  known_weight: 0.15

train:
  n_folds: 2
  cv_group: well_id
  seed: 42
  optimizer: adamw
  lr: 2.0e-4
  lr_min: 2.0e-5
  weight_decay: 1.0e-3
  clip_grad_norm: 5.0
  epochs: 2
  warmup_epochs: 1
  batch_size: 1
  grad_accum: 2
  use_ema: false
  ema_decay: 0.999
  ema_start_epoch: 3
  validate_every_steps: 4
  early_stop_patience: 6
  device: cpu
  num_workers: 0
  mixed_precision: false
  curriculum_enabled: false

infer:
  batch_size: 1
  device: cpu
  use_ema: false
  run_postopt: false
  blend_nn_opt: 0.0
  blend_nn_raw: 0.90
  blend_hmm: 0.0
  blend_linear: 0.10
  blend_neighbor: 0.0

surface:
  enabled: false

neighbor:
  enabled: false

tracking:
  enabled: false
  project: ROGII/Wellbore/BPHWT
  task_name: bpi_conv_tiny_local
  output_uri: ""
  tags: [bpi, conv-tiny, local]
  log_artifacts: false
  log_model: false
  fail_on_error: false

data_clearml:
  enabled: false
  project: ROGII/Wellbore
  name: rogii-wellbore-geology-prediction
  version: 20260519_s3
  cache_dir: ~/.cache/clearml/rogii
  max_workers: 4
