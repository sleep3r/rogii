data:
  data_dir: data
  train_dir: data/train
  test_dir: data/test
  k_wells: 3
  copy_from: ../old/data

window:
  rows_per_step: 32
  history_steps: 8
  future_steps: 16
  vertical_bins: 64
  vertical_radius_ft: 160.0
  stride_steps: 8
  max_windows_per_well: 12
  train_history_mode: teacher_forcing
  valid_history_mode: known_tail_only
  train_center_source: true_tvt
  valid_center_source: tvt_input_tail
  channels: [gr_diff, gr_z_diff, dgr_diff, abs_gr_diff, history_mask, history_sdf, finite_mask]

model:
  k_modes: 4
  conv_channels: [8, 16, 32]
  hidden_dims: [128, 256]
  dropout: 0.05

loss:
  path_loss: mae
  alpha_cls: 0.2
  smooth_lambda: 0.01

train:
  batch_size: 16
  epochs: 2
  learning_rate: 0.001
  weight_decay: 0.0001
  device: auto
  num_workers: 0
  seed: 42

validation:
  valid_fraction: 0.34
  seed: 42

run:
  name: mtp_smoke
  output_dir: artifacts/mtp_smoke
