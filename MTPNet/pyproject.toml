[project]
name = "mtpnet"
version = "0.1.0"
description = "Multi-trajectory heatmap inversion prototype for ROGII wellbore geology prediction."
requires-python = ">=3.11"
dependencies = [
    "catboost>=1.2.10",
    "numpy>=1.26",
    "pandas>=2.0",
    "pyarrow>=15.0",
    "pyyaml>=6.0",
    "torch>=2.2",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
