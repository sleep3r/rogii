[project]
name = "rogii"
version = "0.1.0"
description = "ROGII wellbore geology prediction training pipeline."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "clearml[s3]>=1.18.0",
    "kaggle @ git+https://github.com/Kaggle/kaggle-cli.git",
    "numpy>=2.0",
    "pandas>=2.0",
    "pydantic>=2.11.9",
    "pyyaml>=6.0",
    "scipy>=1.10",
    "scikit-learn>=1.5",
    "lightgbm>=4.6.0",
    "xgboost>=3.2.0",
    "catboost>=1.2.10",
    "pywavelets>=1.9.0",
    "numba>=0.60",
    "optuna>=4.0",
    "spacebridge>=0.1.5",
]

[tool.uv]
package = false

[[tool.uv.index]]
name = "nexus"
url = "https://nexus-hosted.wb.ru/repository/pypi/simple"
explicit = true

[tool.uv.sources]
spacebridge = { index = "nexus" }

[tool.pytest.ini_options]
pythonpath = ["."]

[dependency-groups]
dev = [
    "pytest>=8.4.2",
    "ruff>=0.15.13",
]
