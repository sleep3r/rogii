inherits: drift_ncc.yml

data:
  data_dir: data
  train_dir: data/public_train
  test_dir: data/public_test
  sample_submission: data/public_test/sample_submission.csv
  max_train_wells:
  max_test_wells:
  target_rows: hidden_only

features:
  tail_windows: [25, 100]
  rolling_windows: [25]
  progress_interval: 1
  cache:
    enabled: false
    dir: artifacts/feature_cache_drift_ncc_quick
  kaggle_top:
    beam_configs:
      - [10, 20.0, 144.0, 2, cons]
      - [10, 14.0, 90.0, 5, sm5]
    ncc_windows: [8, 15]
    ncc_stride: 3
    dtw_enabled: false
    dwt_enabled: false
    particle_enabled: true
    particle_count: 96
    ancc_particle_count: 96
    spatial_k: 2
    dense_k: 10
    dense_samples_per_well: 30
    robust_expert_enabled: false

model:
  base_models:
    - id: lgb_drift_quick
      name: lightgbm
      params:
        n_estimators: 90
        early_stopping_rounds: 20
        learning_rate: 0.05
        max_depth: 3
        num_leaves: 31
        min_child_samples: 10
    - id: xgb_drift_quick
      name: xgboost
      params:
        n_estimators: 80
        early_stopping_rounds: 20
        learning_rate: 0.05
        max_depth: 4
        min_child_weight: 4
        tree_method: hist
    - id: cb_drift_quick
      name: catboost
      params:
        iterations: 90
        early_stopping_rounds: 20
        learning_rate: 0.05
        depth: 5
        l2_leaf_reg: 5.0
  blend:
    method: nnls
    iterations: 200
    allow_negative_weights: false

validation:
  n_splits: 3
  final_model_strategy: full_context

outputs:
  output_dir: artifacts/drift_ncc_quick
  submission_path: submission.csv
