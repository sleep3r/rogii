inherits: stack.yml

surface_student:
  seed: 42
  output_dir: artifacts/surface_student
  n_splits: 5
  max_wells: null
  tail_rows: 384
  progress_interval: 25
  rolling_windows:
    - 5
    - 25
    - 101
  spatial_impute: true
  targets:
    - target_geo_teacher_delta_last
    - target_surface_resid_ANCC
    - target_surface_resid_ASTNU
    - target_surface_resid_ASTNL
    - target_surface_resid_EGFDU
    - target_surface_resid_EGFDL
    - target_surface_resid_BUDA
  model:
    name: catboost
    params:
      iterations: 900
      early_stopping_rounds: 100
      learning_rate: 0.035
      depth: 7
      l2_leaf_reg: 5.0
      min_data_in_leaf: 20
      random_strength: 0.5
      bootstrap_type: Bernoulli
      subsample: 0.85
      task_type: CPU
      thread_count: -1
