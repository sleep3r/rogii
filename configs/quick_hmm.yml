inherits: quick.yml

features:
  cache:
    enabled: false
    dir: artifacts/feature_cache_quick_hmm
  kaggle_top:
    hmm_enabled: true
    hmm_max_states: 192
    hmm_max_step_states: 10
    hmm_state_pad: 55.0
    hmm_min_state_span: 80.0
    hmm_include_typewell_range: false
    hmm_gr_weight: 0.25
    hmm_prior_weight: 0.20
    hmm_pf_weight: 1.00
    hmm_dtw_weight: 0.30
    hmm_geo_weight: 0.10
    hmm_prior_sigma: 45.0
    hmm_pf_sigma: 12.0
    hmm_dtw_sigma: 22.0
    hmm_geo_sigma: 50.0
    hmm_transition_sigma: 1.0
    hmm_jump_cost: 0.01
    hmm_start_sigma: 12.0
    hmm_start_weight: 1.5
    hmm_pf_gate_threshold: 6.0
