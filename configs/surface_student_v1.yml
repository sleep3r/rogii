inherits: stack.yml

features:
  include_direct_path_features: false
  num_workers: 8
  progress_interval: 25
  cache:
    enabled: true
    dir: artifacts/feature_cache_surface_student_v1
  kaggle_top:
    hmm_enabled: false

surface_student_v1:
  seed: 42
  output_dir: artifacts/surface_student_v1
  max_wells:
  n_splits: 5
  teacher_rows_path: artifacts/surface_teacher/teacher_rows.csv
  schema10_model_path: artifacts/clearml/ed4d9dc6c7cb479881f087fee1217253/model.pkl
  schema10_config_path: artifacts/clearml/ed4d9dc6c7cb479881f087fee1217253/config.yml
  teacher_error_threshold: 5.0
  teacher_min_weight: 0.05
  blend_true_weight: 0.7
  blend_teacher_weight: 0.3
  integration_iterations: 300
  model:
    name: catboost
    params:
      iterations: 1200
      early_stopping_rounds: 120
      learning_rate: 0.035
      depth: 7
      l2_leaf_reg: 6.0
      min_data_in_leaf: 20
      random_strength: 0.4
      bootstrap_type: Bernoulli
      subsample: 0.85
      task_type: CPU
      thread_count: -1
