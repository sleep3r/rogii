seed: 42

data:
  data_dir: data
  train_dir:
  test_dir:
  sample_submission:
  max_train_wells:
  max_test_wells:
  target_rows: hidden_only

features:
  tail_windows: [25, 100, 250]
  rolling_windows: [5, 25, 101]
  include_typewell: true
  include_kaggle_top_signals: true
  kaggle_top:
    beam_configs:
      - [20.0, 144.0, 2, cons]
      - [8.0, 64.0, 2, loose]
      - [14.0, 90.0, 5, sm5]
      - [25.0, 180.0, 2, stiff]
    ncc_windows: [8, 15, 25]
    ncc_stride: 3
    dtw_enabled: true
    dtw_max_query_points: 700
    dtw_max_ref_points: 700
    dtw_radius: 35
    spatial_k: 10
    dense_k: 20
    dense_samples_per_well: 60

model:
  name: hist_gradient_boosting
  params:
    loss: squared_error
    learning_rate: 0.04
    max_iter: 350
    max_leaf_nodes: 31
    min_samples_leaf: 30
    l2_regularization: 0.05
    early_stopping: true
    validation_fraction: 0.1
    n_iter_no_change: 25

validation:
  enabled: true
  n_splits: 5
  max_wells: 150

postprocess:
  residual_weight: auto
  residual_weight_grid: [0.0, 0.1, 0.2, 0.35, 0.5, 0.75, 1.0]
  residual_clip: 250.0

outputs:
  output_dir: artifacts/hgb
  submission_path: submission.csv
