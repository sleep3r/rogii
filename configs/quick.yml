seed: 42

data:
  data_dir: data
  train_dir: data/public_train
  test_dir: data/public_test
  sample_submission: data/public_test/sample_submission.csv
  max_train_wells:
  max_test_wells:
  target_rows: hidden_only

features:
  tail_windows: [25, 100]
  rolling_windows: [5, 25]
  include_typewell: true
  include_kaggle_top_signals: true
  kaggle_top:
    beam_configs:
      - [20.0, 144.0, 2, cons]
      - [8.0, 64.0, 2, loose]
      - [14.0, 90.0, 5, sm5]
    ncc_windows: [8, 15]
    ncc_stride: 3
    dtw_enabled: true
    dtw_max_query_points: 300
    dtw_max_ref_points: 300
    dtw_radius: 25
    spatial_k: 2
    dense_k: 10
    dense_samples_per_well: 30

model:
  name: hist_gradient_boosting
  params:
    loss: squared_error
    learning_rate: 0.05
    max_iter: 80
    max_leaf_nodes: 15
    min_samples_leaf: 20
    l2_regularization: 0.1
    early_stopping: true
    validation_fraction: 0.15
    n_iter_no_change: 10

validation:
  enabled: true
  n_splits: 3
  max_wells:

postprocess:
  residual_weight: auto
  residual_weight_grid: [0.0, 0.1, 0.2, 0.35, 0.5, 0.75, 1.0]
  residual_clip: 250.0

outputs:
  output_dir: artifacts/quick
  submission_path: submission.csv
