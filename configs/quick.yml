seed: 42

data:
  data_dir: data
  train_dir: data/public_train
  test_dir: data/public_test
  sample_submission: data/public_test/sample_submission.csv
  max_train_wells:
  max_test_wells:
  target_rows: hidden_only

features:
  tail_windows: [25, 100]
  rolling_windows: [5, 25]
  include_typewell: true
  include_kaggle_top_signals: true
  kaggle_top:
    beam_configs:
      - [20.0, 144.0, 2, cons]
      - [8.0, 64.0, 2, loose]
      - [14.0, 90.0, 5, sm5]
    ncc_windows: [8, 15]
    ncc_stride: 3
    dtw_enabled: true
    dtw_max_query_points: 300
    dtw_max_ref_points: 300
    dtw_radius: 25
    dwt_enabled: true
    dwt_wavelet: db4
    dwt_level: 2
    dwt_max_query_points: 300
    dwt_max_ref_points: 300
    dwt_radius: 25
    particle_enabled: true
    particle_count: 96
    particle_process_noise: 4.0
    particle_observation_scale: 18.0
    spatial_k: 2
    dense_k: 10
    dense_samples_per_well: 30

model:
  name: stack
  base_models:
    - name: lightgbm
      params:
        n_estimators: 80
        learning_rate: 0.05
        num_leaves: 31
        min_child_samples: 20
    - name: xgboost
      params:
        n_estimators: 70
        learning_rate: 0.05
        max_depth: 4
        min_child_weight: 4
        tree_method: hist
    - name: catboost
      params:
        iterations: 80
        learning_rate: 0.05
        depth: 5
        l2_leaf_reg: 5.0
  blend:
    method: ridge
    alpha: 1.0

validation:
  enabled: true
  n_splits: 3
  max_wells:

postprocess:
  residual_weight: auto
  residual_weight_grid: [0.0, 0.1, 0.2, 0.35, 0.5, 0.75, 1.0]
  residual_clip: 250.0

outputs:
  output_dir: artifacts/quick
  submission_path: submission.csv
